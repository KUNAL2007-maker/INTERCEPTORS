# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — CryptoTrace / INTERCEPTORS (SIH26183). Render-only,
# full-stack, all persistent (NOT serverless) — so long traces and the
# real-time blockchain listeners run with no function-timeout limits (the
# reason we deploy the full stack here rather than on Vercel serverless).
#
# This monorepo's app lives in FRONTEND/; each service sets its own rootDir.
# Two services in ONE region so they share Render's private network:
#   • interceptors-web : Next.js — UI, API routes, and the in-process real-time
#                        monitoring loop. Public.
#   • interceptors-ml  : FastAPI ML sidecar — real GDS (NetworkX) + XGBoost + A*.
#                        PRIVATE (no public URL): it has no auth of its own, so
#                        only the web service reaches it over the internal
#                        network. The app fully degrades to its TypeScript
#                        heuristic if this service is down.
#
# SECRETS ARE NEVER COMMITTED. JWT_SECRET / ORDER_SIGNING_SEED are generated by
# Render and persist across restarts (the dev fallback is per-process random,
# which would invalidate tokens on every restart). Provider API keys are
# `sync: false`: paste them once in the Render dashboard, or leave them blank
# and the app runs its fully-featured offline demo.
#
# PLANS: persistent listeners need an always-on instance. `starter` stays up
# 24/7. On `free`, a web service sleeps after ~15 min idle and private services
# are unavailable — the real-time loop pauses while asleep. Bump the plan for a
# live demo.
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── Next.js app (public) ────────────────────────────────────────────────────
  - type: web
    name: interceptors-web
    runtime: node
    plan: starter
    region: singapore              # closest Render region to India
    rootDir: FRONTEND
    buildCommand: npm ci && npm run build
    startCommand: npm run start     # `next start` binds 0.0.0.0 and honours $PORT
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Auth signing secrets — generated once by Render, stable across restarts.
      - key: JWT_SECRET
        generateValue: true
      - key: ORDER_SIGNING_SEED
        generateValue: true
      # Private address of the ML sidecar as bare host:port. ml-service.ts
      # prepends http:// when the scheme is absent, so this is sufficient.
      - key: ML_SERVICE_URL
        fromService:
          type: pserv
          name: interceptors-ml
          property: hostport
      # ── Optional live-data keys — set in the dashboard, or leave blank for the
      #    offline demo. NEVER commit real keys; rotate any key ever exposed. ──
      - key: ALCHEMY_API_KEY         # EVM (Ethereum + Polygon) live tracing
        sync: false
      - key: TRONGRID_API_KEY        # TRON live tracing
        sync: false
      - key: GEMINI_API_KEY          # AI narrative (degrades to local report)
        sync: false
      # Neo4j (optional persisted graph projection). Unset ⇒ in-memory graph.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

  # ── Python ML sidecar (private) ─────────────────────────────────────────────
  - type: pserv
    name: interceptors-ml
    runtime: python
    plan: starter
    region: singapore              # MUST match the web service's region
    rootDir: FRONTEND/ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Optional: point the sidecar's own GDS at Neo4j (it falls back to
      # NetworkX on any error). Unset ⇒ NetworkX-only default path.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
